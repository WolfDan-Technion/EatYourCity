<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מפת צמחי מאכל</title>
  <meta name="description" content="מפה שיתופית של מיקומי צמחי מאכל / A shared map of edible plants" />

  <!-- Leaflet (map library) - CSS and JS from the unpkg CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font that supports Hebrew and English (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" />

  <style>
    /* =========================================================
       1. COLORS & BASICS (green nature palette)
       ========================================================= */
    :root {
      --green-dark: #1f4d2b;
      --green: #2e7d32;
      --green-light: #66bb6a;
      --green-pale: #e8f5e9;
      --cream: #fbfaf5;
      --text: #1d2a1f;
      --muted: #5f6f62;
      --warning-bg: #fff4d6;
      --warning-text: #6b4e00;
      --danger: #c62828;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--cream);
    }

    /* The page is a vertical column: header, disclaimer, then the map area */
    body {
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================================================
       2. HEADER (title, search, buttons, login, language)
       ========================================================= */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--green-dark);
      color: #fff;
      flex-wrap: wrap;
      position: relative;
      z-index: 1500; /* above the map so the search dropdown is visible */
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .search-wrap input {
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-family: inherit;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--green-light);
      color: #fff;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.active { background: #f9a825; color: #222; }
    .btn.secondary { background: #e0e0e0; color: var(--text); }
    .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.6); }
    .btn.danger { background: var(--danger); }
    .btn.small { padding: 6px 12px; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Login area in the header */
    .auth-area { display: flex; gap: 6px; align-items: center; }

    /* Only shown on small screens (see media query below) */
    #panelToggle { display: none; }

    /* Search results dropdown (also used by the autocomplete in the form) */
    .results-list {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      left: 0;
      margin: 0;
      padding: 0;
      list-style: none;
      background: #fff;
      color: var(--text);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-height: 360px;
      overflow-y: auto;
      z-index: 2100;
    }
    .results-list:empty { display: none; }

    .results-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .results-list li:hover { background: var(--green-pale); }
    .results-list li.message { cursor: default; color: var(--muted); }
    .results-list li.message.error { color: var(--danger); }
    .results-list li.section {
      cursor: default;
      background: #f6f8f6;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 4px 12px;
    }
    .results-list img, .results-list .no-img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--green-pale);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .results-list .result-text { flex: 1; min-width: 0; }
    .results-list small { color: var(--muted); display: block; font-style: italic; }
    .results-list .edible-mark { flex-shrink: 0; font-size: 0.8rem; color: var(--green); font-weight: 700; }

    /* =========================================================
       3. SAFETY DISCLAIMER
       ========================================================= */
    .disclaimer {
      background: var(--warning-bg);
      color: var(--warning-text);
      padding: 6px 16px;
      font-size: 0.88rem;
      text-align: center;
      border-bottom: 1px solid #f0d48a;
    }

    /* =========================================================
       4. MAP + SIDE PANEL
       ========================================================= */
    .main {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      direction: ltr; /* Leaflet controls work best left-to-right */
    }

    /* While in "add plant" mode the cursor becomes a crosshair */
    #map.adding { cursor: crosshair; }

    /* Popups are inside the LTR map, so in Hebrew we switch them back to RTL */
    .leaflet-popup-content {
      font-family: "Rubik", system-ui, sans-serif;
      font-size: 0.92rem;
      min-width: 190px;
    }
    html[dir="rtl"] .leaflet-popup-content { direction: rtl; text-align: right; }
    .leaflet-popup-content h3 { margin: 0 0 4px; color: var(--green-dark); }
    .leaflet-popup-content p { margin: 4px 0; }
    .leaflet-popup-content .sci { font-style: italic; color: var(--muted); }
    .popup-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    /* Custom leaf marker */
    .plant-marker {
      font-size: 22px;
      line-height: 32px;
      text-align: center;
      width: 32px;
      height: 32px;
      background: #fff;
      border: 2px solid var(--green);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .plant-marker span { display: inline-block; transform: rotate(45deg); }

    /* "Locate me" button (a Leaflet control) */
    .locate-btn {
      width: 34px;
      height: 34px;
      font-size: 18px;
      background: #fff;
      border: none;
    }

    /* Banner shown while choosing a location for a new plant */
    .add-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #f9a825;
      color: #222;
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      z-index: 1000;
      font-weight: 500;
      display: none;
    }
    .add-hint.show { display: block; }

    /* Side panel with the list of visible plants */
    .side-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 300px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .side-panel header {
      padding: 12px;
      background: var(--green-pale);
    }
    .side-panel h2 { margin: 0 0 8px; font-size: 1.05rem; color: var(--green-dark); }
    .side-panel input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    #plantList {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
    }
    #plantList li {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    #plantList li:hover { background: var(--green-pale); }
    #plantList li strong { display: block; }
    #plantList li small { color: var(--muted); display: block; }
    #plantList li.empty { cursor: default; color: var(--muted); text-align: center; }
    .status-line {
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid #eee;
    }

    /* =========================================================
       5. MODALS (plant info, add-plant form, nickname)
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }
    .modal h2 { margin-top: 0; color: var(--green-dark); padding-inline-end: 28px; }
    .close-btn {
      position: absolute;
      top: 10px;
      inset-inline-end: 10px; /* the "end" side: left in Hebrew, right in English */
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--muted);
    }

    .plant-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: var(--radius);
    }
    .photo-credit { font-size: 0.72rem; color: var(--muted); margin: 2px 0 10px; direction: ltr; text-align: left; }
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table th, .info-table td {
      text-align: start;
      padding: 6px 4px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    .info-table th { color: var(--muted); font-weight: 500; width: 35%; }
    .wiki-text { line-height: 1.55; margin: 12px 0 4px; }
    .info-links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.9rem; margin-top: 6px; }
    .info-links a { color: var(--green); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .badge.small { padding: 2px 8px; font-size: 0.78rem; margin: 2px 0; }
    .badge.edible { background: var(--green-pale); color: var(--green); border: 1px solid var(--green-light); }
    .badge.unknown { background: #f5f5f5; color: #616161; border: 1px solid #bdbdbd; }

    .small-warning {
      background: var(--warning-bg);
      color: var(--warning-text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 12px;
    }
    .note { font-size: 0.85rem; color: var(--muted); }

    /* Form fields */
    .form-row { margin-bottom: 12px; position: relative; }
    .form-row label { display: block; font-weight: 500; margin-bottom: 4px; }
    .form-row input, .form-row textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .form-row .hint { font-size: 0.8rem; color: var(--muted); }
    .form-row input[readonly] { background: #f6f6f6; }
    .form-error { color: var(--danger); font-weight: 500; min-height: 1.2em; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-start; }

    /* Small pop-up message at the bottom of the screen */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green-dark);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      z-index: 4000;
      display: none;
      max-width: 90vw;
      text-align: center;
    }
    #toast.error { background: var(--danger); }
    #toast.show { display: block; }

    /* =========================================================
       6. MOBILE LAYOUT (screens narrower than 700px)
       ========================================================= */
    @media (max-width: 700px) {
      .topbar { padding: 8px 10px; gap: 8px; }
      .logo { font-size: 1rem; }
      .search-wrap { order: 3; flex-basis: 100%; }
      #panelToggle { display: inline-block; }
      .btn { padding: 8px 12px; font-size: 0.88rem; }
      .disclaimer { font-size: 0.78rem; padding: 5px 10px; }

      /* The side panel becomes a bottom sheet that can be opened/closed */
      .side-panel {
        top: auto;
        right: 0;
        left: 0;
        bottom: 0;
        width: auto;
        height: 45%;
        border-radius: var(--radius) var(--radius) 0 0;
        display: none;
      }
      .side-panel.open { display: flex; }
    }
  </style>
</head>

<body>
  <!-- All visible texts have a data-i18n="key" attribute.
       JavaScript fills them from the TEXTS dictionary in the chosen language. -->

  <!-- ================= HEADER ================= -->
  <header class="topbar">
    <h1 class="logo" data-i18n="logo">🌿 מפת צמחי מאכל</h1>

    <!-- Plant search (built-in list + iNaturalist) -->
    <div class="search-wrap">
      <input id="searchInput" type="search" autocomplete="off" data-i18n-ph="searchPlaceholder" />
      <ul id="searchResults" class="results-list"></ul>
    </div>

    <button id="addBtn" class="btn"></button>
    <button id="panelToggle" class="btn secondary" data-i18n="panelToggle"></button>

    <!-- Login / user area (filled by JavaScript) -->
    <div id="authArea" class="auth-area"></div>

    <!-- Language switch -->
    <button id="langBtn" class="btn ghost small" data-i18n="langSwitch"></button>
  </header>

  <!-- ================= SAFETY DISCLAIMER ================= -->
  <div class="disclaimer" role="note" data-i18n-html="disclaimer"></div>

  <!-- ================= MAP + SIDE PANEL ================= -->
  <main class="main">
    <div id="map"></div>
    <div id="addHint" class="add-hint" data-i18n="addHint"></div>

    <aside id="sidePanel" class="side-panel">
      <header>
        <h2><span data-i18n="panelTitle"></span> (<span id="visibleCount">0</span>)</h2>
        <input id="listFilter" type="search" data-i18n-ph="listFilter" />
      </header>
      <ul id="plantList"></ul>
      <div id="statusLine" class="status-line"></div>
    </aside>
  </main>

  <!-- ================= MODAL: PLANT INFO ================= -->
  <div id="infoModal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close-btn" data-close="infoModal" aria-label="close">×</button>
      <div id="infoContent"></div>
    </div>
  </div>

  <!-- ================= MODAL: ADD PLANT FORM ================= -->
  <div id="addModal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close-btn" data-close="addModal" aria-label="close">×</button>
      <h2 data-i18n="addTitle"></h2>

      <form id="addForm" novalidate>
        <div class="form-row">
          <label for="plantName" data-i18n="plantNameLabel"></label>
          <input id="plantName" type="text" maxlength="100" autocomplete="off" data-i18n-ph="plantNamePh" />
          <ul id="nameSuggestions" class="results-list"></ul>
          <div class="hint" data-i18n="plantNameHint"></div>
        </div>

        <div id="pickedInfo"></div>

        <div class="form-row">
          <label for="scientificName" data-i18n="sciLabel"></label>
          <input id="scientificName" type="text" maxlength="150" readonly />
        </div>

        <div class="form-row">
          <label for="ediblePart" data-i18n="ediblePartLabel"></label>
          <input id="ediblePart" type="text" maxlength="200" data-i18n-ph="ediblePartPh" />
        </div>

        <div class="form-row">
          <label for="notes" data-i18n="notesLabel"></label>
          <textarea id="notes" maxlength="500" data-i18n-ph="notesPh"></textarea>
        </div>

        <div class="form-row">
          <label data-i18n="locationLabel"></label>
          <input id="locationText" type="text" readonly />
        </div>

        <p id="formError" class="form-error"></p>

        <div class="form-actions">
          <button type="submit" id="saveBtn" class="btn" data-i18n="save"></button>
          <button type="button" class="btn secondary" data-close="addModal" data-i18n="cancel"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= MODAL: NICKNAME ================= -->
  <div id="nickModal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close-btn" data-close="nickModal" aria-label="close">×</button>
      <h2 data-i18n="nickTitle"></h2>
      <p class="note" data-i18n="nickNote"></p>
      <form id="nickForm" novalidate>
        <div class="form-row">
          <label for="nickInput" data-i18n="nickLabel"></label>
          <input id="nickInput" type="text" maxlength="30" autocomplete="nickname" />
        </div>
        <p id="nickError" class="form-error"></p>
        <div class="form-actions">
          <button type="submit" id="nickSaveBtn" class="btn" data-i18n="save"></button>
          <button type="button" class="btn secondary" data-close="nickModal" data-i18n="later"></button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <!-- =====================================================================
       JAVASCRIPT
       type="module" lets us "import" the Firebase SDK straight from the CDN.
       ===================================================================== -->
  <script type="module">
    // Firebase modular SDK (v10) from Google's CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, doc, getDoc, onSnapshot,
      serverTimestamp, writeBatch
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    /* =====================================================================
       0. SETTINGS
       ===================================================================== */

    // Firebase config: Firebase console -> Project settings -> "Your apps" -> Web app -> Config
    // (This is NOT a secret - security comes from the Firestore rules at the bottom of the file.)
    const firebaseConfig = {
      apiKey: "AIzaSyDSDkGBuFxCUuFW4tKmIf1tQTBgSJyt3IU",
      authDomain: "eatyourcity-d6421.firebaseapp.com",
      projectId: "eatyourcity-d6421",
      storageBucket: "eatyourcity-d6421.firebasestorage.app",
      messagingSenderId: "573822195180",
      appId: "1:573822195180:web:556b2a79a05badc6a3dcc9",
      measurementId: "G-JRJV2DVL5R"
    };

    // The admin's Firebase user ID (can delete any plant).
    // Found in: Firebase console -> Authentication -> Users -> "User UID".
    // The same value is in the Firestore rules at the bottom of this file.
    const ADMIN_UID = "j9uBRpG3HuXV7JZ1rz5yuEem8Xj2";

    // Plant information comes from iNaturalist (free, no key, supports Hebrew names)
    const INAT_BASE = "https://api.inaturalist.org/v1";
    const INAT_PLANTS_ID = 47126; // iNaturalist's ID for the plant kingdom (filters out animals)

    // Maximum text lengths (the same numbers are used in the Firestore rules)
    const LIMITS = { name: 100, scientificName: 150, ediblePart: 200, notes: 500, addedByName: 30 };

    /* =====================================================================
       1. LANGUAGE (Hebrew / English)
       Every text on the page is here, in both languages.
       {name} in a text is replaced with a value, e.g. t("addedBy", {name: "Dana"}).
       ===================================================================== */
    const TEXTS = {
      he: {
        pageTitle: "מפת צמחי מאכל",
        logo: "🌿 מפת צמחי מאכל",
        langSwitch: "English",
        searchPlaceholder: "חיפוש צמח בעברית, באנגלית או בשם מדעי (למשל: תות, rosemary)",
        addPlant: "➕ הוספת צמח",
        cancelAdd: "✖ ביטול הוספה",
        panelToggle: "📋 רשימה",
        disclaimer: "⚠️ <strong>אזהרת בטיחות:</strong> לעולם אל תאכלו צמח בר אלא אם אתם בטוחים ב-100% בזיהוי שלו. המידע באתר נועד למטרות לימוד בלבד. חלק מצמחי הבר בישראל מוגנים - אין לקטוף אותם בטבע.",
        addHint: "לחצו על המפה כדי לבחור את מיקום הצמח",
        panelTitle: "צמחים באזור המוצג",
        listFilter: "סינון לפי שם, הערה או מוסיף...",
        listEmpty: "אין צמחים באזור הזה. הזיזו את המפה או הוסיפו צמח!",
        loading: "טוען...",
        totalPlants: "סה\"כ {n} צמחים במאגר",
        loadError: "שגיאה בטעינת הצמחים: {msg}",
        readDenied: "אין הרשאת קריאה (בדקו את חוקי Firestore)",
        firebaseError: "שגיאה בחיבור ל-Firebase - בדקו את ההגדרות",

        // Add form
        addTitle: "הוספת צמח למפה",
        plantNameLabel: "שם הצמח *",
        plantNamePh: "הקלידו שם בעברית או באנגלית",
        plantNameHint: "בחירה מהרשימה תמלא אוטומטית את השם המדעי והחלק האכיל. ✅ = ברשימת הצמחים האכילים שלנו.",
        sciLabel: "שם מדעי",
        ediblePartLabel: "חלק אכיל",
        ediblePartPh: "למשל: פירות, עלים",
        notesLabel: "הערות",
        notesPh: "למשל: עץ ליד הספסל, מניב בקיץ",
        locationLabel: "מיקום",
        save: "💾 שמירה",
        cancel: "ביטול",
        later: "אחר כך",
        nameRequired: "יש להזין שם צמח",

    /* =====================================================================
       3. SMALL HELPER FUNCTIONS
       ===================================================================== */

    // Shortcut for document.getElementById
    const $ = (id) => document.getElementById(id);

    // Turns text into safe HTML (so users can't inject code through plant names)
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    // Only allow https links (safety)
    function safeUrl(url) {
      return typeof url === "string" && url.startsWith("https://") ? url : "";
    }

    // Makes text easy to compare: lowercase, no Hebrew vowel marks, no punctuation
    function normalize(text) {
      return String(text ?? "")
        .toLowerCase()
        .replace(/[֑-ׇ]/g, "")       // Hebrew niqqud
        .replace(/[-'"׳״×]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Waits until the user stops typing before running fn (saves API calls)
    function debounce(fn, delayMs) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delayMs);
      };
    }

    // Shows a short message at the bottom of the screen
    let toastTimer;
    function showToast(message, isError = false) {
      const toast = $("toast");
      toast.textContent = message;
      toast.className = "show" + (isError ? " error" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (toast.className = ""), 4500);
    }

    // Open / close a modal window by its id
    function openModal(id) { $(id).classList.add("show"); }
    function closeModal(id) { $(id).classList.remove("show"); }

    // Any element with data-close="modalId" closes that modal
    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-close]");
      if (target) closeModal(target.dataset.close);
      // Clicking the dark background also closes the modal
      if (e.target.classList.contains("modal-backdrop")) closeModal(e.target.id);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") ["infoModal", "addModal", "nickModal"].forEach(closeModal);
    });

    /* =====================================================================
       4. EDIBILITY LOOKUP (uses the built-in list above)
       ===================================================================== */

    // Returns the matching entry from EDIBLE_PLANTS, or null if we don't know
    function findEdible(scientificName) {
      const full = normalize(scientificName);
      if (!full) return null;
      const genus = full.split(" ")[0];

      // 1) species match, including old names and subspecies ("morus alba var. x" -> "morus alba")
      const exact = EDIBLE_PLANTS.find((p) =>
        !p.genus && [p.sci, ...(p.alt || [])].some((n) => {
          const name = normalize(n);
          return full === name || full.startsWith(name + " ");
        }));
      if (exact) return exact;

      // 2) whole-genus match, e.g. any "Morus ..." is a mulberry
      return EDIBLE_PLANTS.find((p) => p.genus && normalize(p.sci) === genus) || null;
    }

    // Searches the built-in list by Hebrew, English or scientific name
    function searchEdibleList(query) {
      const q = normalize(query);
      if (q.length < 2) return [];
      return EDIBLE_PLANTS.filter((p) =>
        [...p.he, p.en, p.sci, ...(p.alt || [])].some((name) => normalize(name).includes(q))
      ).slice(0, 6);
    }

    // The name of a list entry in the current language
    function entryName(entry) {
      return lang === "en" ? entry.en : entry.he[0];
    }

    // HTML for the edible / unknown badge
    function edibleBadge(entry, small = false) {
      const size = small ? " small" : "";
      return entry
        ? `<span class="badge edible${size}">${t("edible")}</span>`
        : `<span class="badge unknown${size}">${t("unknownEdible")}</span>`;
    }

    /* =====================================================================
       5. THE MAP (Leaflet)
       ===================================================================== */

    // Two base layers: streets and satellite
    const streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
    });

    // Create the map centered on Israel
    const map = L.map("map", {
      center: [31.5, 34.9],
      zoom: 8,
      layers: [streetLayer]
    });

    // Layer switcher (re-created when the language changes, to translate its labels)
    let layersControl = null;
    function drawLayersControl() {
      if (layersControl) layersControl.remove();
      layersControl = L.control.layers(
        { [t("streets")]: streetLayer, [t("satellite")]: satelliteLayer },
        null,
        { position: "topleft", collapsed: true }
      ).addTo(map);
    }

    // Custom "locate me" button
    let locateBtn = null;
    const LocateControl = L.Control.extend({
      options: { position: "topleft" },
      onAdd() {
        const div = L.DomUtil.create("div", "leaflet-bar");
        locateBtn = L.DomUtil.create("button", "locate-btn", div);
        locateBtn.type = "button";
        locateBtn.textContent = "📍";
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.on(locateBtn, "click", locateMe);
        return div;
      }
    });

    let myLocationMarker = null;

    function locateMe() {
      if (!navigator.geolocation) {
        showToast(t("noGeo"), true);
        return;
      }
      showToast(t("locating"));
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];
          map.setView(latlng, 16);
          if (myLocationMarker) myLocationMarker.remove();
          myLocationMarker = L.circleMarker(latlng, {
            radius: 9, color: "#fff", weight: 3, fillColor: "#1976d2", fillOpacity: 1
          }).addTo(map).bindPopup(`<div>${escapeHtml(t("youAreHere"))}</div>`);
          showToast(t("located"));
        },
        (err) => {
          const keys = { 1: "geoDenied", 2: "geoUnavailable", 3: "geoTimeout" };
          showToast(t(keys[err.code] || "geoError"), true);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // The icon used for every plant marker
    const plantIcon = L.divIcon({
      className: "",
      html: '<div class="plant-marker"><span>🌿</span></div>',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
    });

    /* =====================================================================
       6. PLANT INFORMATION APIs (iNaturalist + Wikipedia)
       ===================================================================== */

    // One function for all iNaturalist requests, with clear error messages
    async function inatRequest(path, params = {}) {
      const url = new URL(INAT_BASE + path);
      for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);

      let response;
      try {
        response = await fetch(url);
      } catch {
        throw new Error(t("networkError"));
      }
      if (response.status === 429) throw new Error(t("tooManyRequests"));
      if (!response.ok) throw new Error(t("serverError", { code: response.status }));
      return response.json();
    }

    // Search plants by name. iNaturalist sorts by popularity, so the common species comes first.
    async function searchInat(query) {
      const json = await inatRequest("/taxa/autocomplete", {
        q: query, locale: lang, taxon_id: INAT_PLANTS_ID, per_page: 12, is_active: true
      });
      const usefulRanks = ["species", "hybrid", "subspecies", "variety", "genus"];
      return (json.results || []).filter((tx) => usefulRanks.includes(tx.rank));
    }

    // Full details of one taxon by its iNaturalist id (always in Hebrew, to get the Hebrew name;
    // the English name comes in "english_common_name")
    async function getTaxon(id) {
      const json = await inatRequest("/taxa/" + encodeURIComponent(id), { locale: "he" });
      return (json.results || [])[0] || null;
    }

    // Find a taxon by its scientific name (for plants saved without an id)
    async function findTaxonByName(scientificName) {
      const json = await inatRequest("/taxa/autocomplete", {
        q: scientificName, taxon_id: INAT_PLANTS_ID, per_page: 5
      });
      const results = json.results || [];
      const match = results.find((tx) => normalize(tx.name) === normalize(scientificName)) || results[0];
      return match ? getTaxon(match.id) : null;
    }

    // Short summary from Wikipedia. Returns null if there is no article.
    async function wikiSummary(wikiLang, title) {
      if (!title) return null;
      try {
        const url = `https://${wikiLang}.wikipedia.org/api/rest_v1/page/summary/` +
          encodeURIComponent(title.replace(/ /g, "_"));
        const response = await fetch(url);
        if (!response.ok) return null;
        const json = await response.json();
        if (json.type !== "standard" || !json.extract) return null;
        return { text: json.extract, url: json.content_urls?.desktop?.page || "", lang: wikiLang };
      } catch {
        return null; // Wikipedia is "nice to have" - ignore its errors
      }
    }

    // Wikipedia in the page's language first, then the other language
    async function getWiki(hebrewName, englishName, scientificName) {
      if (lang === "en") {
        return (await wikiSummary("en", scientificName)) ||
               (await wikiSummary("en", englishName)) ||
               (await wikiSummary("he", hebrewName));
      }
      return (await wikiSummary("he", hebrewName)) ||
             (await wikiSummary("he", scientificName)) ||
             (await wikiSummary("en", scientificName));
    }

    /* ---------- Search results: built-in list first, then iNaturalist ---------- */

    // Converts both kinds of results into one simple shape for display
    function listItem(entry) {
      const otherName = lang === "en" ? entry.he[0] : entry.en;
      return {
        title: entryName(entry),
        subtitle: entry.sci + (entry.genus ? " " + t("allSpecies") : "") + " · " + otherName,
        image: "",
        sci: entry.sci,
        taxonId: 0,
        edible: entry
      };
    }
    function inatItem(taxon) {
      const common = taxon.preferred_common_name;
      const english = taxon.english_common_name;
      return {
        title: common || english || taxon.name,
        subtitle: taxon.name + (taxon.rank === "genus" ? " " + t("genus") : "") +
                  (english && english !== common ? " · " + english : ""),
        image: safeUrl(taxon.default_photo?.square_url),
        sci: taxon.name,
        taxonId: taxon.id,
        edible: findEdible(taxon.name)
      };
    }

    // Draws result items inside a <ul>; onPick runs when one is clicked
    function renderResults(listEl, sections, onPick) {
      listEl.innerHTML = "";
      for (const section of sections) {
        if (section.items.length === 0 && !section.message) continue;

        const header = document.createElement("li");
        header.className = "section";
        header.textContent = section.title;
        listEl.appendChild(header);

        if (section.message) {
          const li = document.createElement("li");
          li.className = "message" + (section.isError ? " error" : "");
          li.textContent = section.message;
          listEl.appendChild(li);
        }

        for (const item of section.items) {
          const li = document.createElement("li");
          li.innerHTML = `
            ${item.image ? `<img src="${escapeHtml(item.image)}" alt="" loading="lazy">` : '<div class="no-img">🌿</div>'}
            <div class="result-text">
              <strong>${escapeHtml(item.title)}</strong>
              <small>${escapeHtml(item.subtitle)}</small>
            </div>
            ${item.edible ? `<span class="edible-mark">${t("edible")}</span>` : ""}`;
          li.addEventListener("click", () => onPick(item));
          listEl.appendChild(li);
        }
      }
    }

    // Runs a search and keeps the dropdown updated.
    // The built-in list shows instantly; iNaturalist results are added when they arrive.
    function createSearch(inputEl, listEl, onPick) {
      let counter = 0; // used to ignore old, slow answers

      async function run() {
        const query = inputEl.value.trim();
        if (query.length < 2) { listEl.innerHTML = ""; return; }

        const myTurn = ++counter;
        const listItems = searchEdibleList(query).map(listItem);
        const listSection = { title: t("listSection"), items: listItems };
        renderResults(listEl, [listSection, { title: "iNaturalist", items: [], message: t("searching") }], onPick);

        let inatSection;
        try {
          const shownNames = new Set(listItems.map((i) => normalize(i.sci)));
          const taxa = (await searchInat(query)).filter((tx) => !shownNames.has(normalize(tx.name)));
          inatSection = { title: t("inatSection"), items: taxa.map(inatItem) };
          if (taxa.length === 0 && listItems.length === 0) inatSection.message = t("noResults");
        } catch (err) {
          inatSection = { title: "iNaturalist", items: [], message: err.message, isError: true };
        }
        if (myTurn === counter) renderResults(listEl, [listSection, inatSection], onPick);
      }

      inputEl.addEventListener("input", debounce(run, 400));
      return run;
    }

    /* ---------- The "more info" window ---------- */
    async function showPlantInfo({ taxonId, scientificName, name }) {
      const box = $("infoContent");
      box.innerHTML = `<p>${t("loading")}</p>`;
      openModal("infoModal");

      let taxon = null;
      let errorText = "";
      try {
        if (taxonId) taxon = await getTaxon(taxonId);
        else if (scientificName) taxon = await findTaxonByName(scientificName);
      } catch (err) {
        errorText = err.message;
      }

      const sci = taxon?.name || scientificName || "";
      const edible = findEdible(sci);
      const hebrewName = edible?.he[0] || taxon?.preferred_common_name || "";
      const englishName = taxon?.english_common_name || edible?.en || "";
      const title = (lang === "en" ? englishName || hebrewName : hebrewName || englishName) || name || sci || t("plant");
      const family = (taxon?.ancestors || []).find((a) => a.rank === "family");
      const photo = taxon?.default_photo;
      const wiki = await getWiki(hebrewName, englishName, sci);

      box.innerHTML = `
        <h2>${escapeHtml(title)}</h2>
        ${edibleBadge(edible)}
        ${photo && safeUrl(photo.medium_url) ? `
          <img class="plant-img" src="${escapeHtml(safeUrl(photo.medium_url))}" alt="${escapeHtml(sci)}">
          <p class="photo-credit">${escapeHtml(photo.attribution || "")}</p>` : ""}
        <table class="info-table">
          <tr><th>${t("hebrewName")}</th><td>${escapeHtml(hebrewName || "—")}</td></tr>
          <tr><th>${t("englishName")}</th><td>${escapeHtml(englishName || "—")}</td></tr>
          <tr><th>${t("sciName")}</th><td><em>${escapeHtml(sci || "—")}</em></td></tr>
          <tr><th>${t("family")}</th><td>${family ? escapeHtml((family.preferred_common_name ? family.preferred_common_name + " - " : "") + family.name) : "—"}</td></tr>
          ${edible ? `
            <tr><th>${t("edibleParts")}</th><td>${escapeHtml(tr(edible.parts))}</td></tr>
            <tr><th>${t("season")}</th><td>${escapeHtml(tr(edible.season) || "—")}</td></tr>` : ""}
        </table>
        ${edible?.warning ? `<p class="small-warning">⚠️ ${escapeHtml(tr(edible.warning))}</p>` : ""}
        ${!edible ? `<p class="note">${t("notInList")}</p>` : ""}
        ${errorText ? `<p class="form-error">${escapeHtml(errorText)}</p>` : ""}
        ${wiki ? `<p class="wiki-text" dir="${wiki.lang === "he" ? "rtl" : "ltr"}">${escapeHtml(wiki.text)}</p>` : ""}
        <div class="info-links">
          ${wiki && safeUrl(wiki.url) ? `<a href="${escapeHtml(wiki.url)}" target="_blank" rel="noopener">${t("wikiLink")}</a>` : ""}
          ${taxon ? `<a href="https://www.inaturalist.org/taxa/${encodeURIComponent(taxon.id)}" target="_blank" rel="noopener">🔎 iNaturalist</a>` : ""}
        </div>
        <p class="small-warning">${t("safety")}</p>`;
    }

    /* ---------- The search box in the header ---------- */
    const searchInput = $("searchInput");
    const searchResults = $("searchResults");
    createSearch(searchInput, searchResults, (item) => {
      searchResults.innerHTML = "";
      showPlantInfo({ taxonId: item.taxonId, scientificName: item.sci, name: item.title });
    });

    // Hide dropdowns when clicking somewhere else
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) searchResults.innerHTML = "";
      if (!e.target.closest("#addForm .form-row")) $("nameSuggestions").innerHTML = "";
    });

    /* =====================================================================
       7. FIREBASE: DATABASE + LOGIN
       ===================================================================== */

    let db = null;
    let auth = null;
    let currentUser = null;
    let myNickname = "";    // the nickname shown to others ("" = not chosen yet)
    let myNicknameKey = ""; // lowercase version, used to make nicknames unique

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch (err) {
      console.error(err);
      setStatus("firebaseError");
      $("addBtn").disabled = true;
    }

    // Is the logged-in user allowed to delete this plant?
    function canDelete(plant) {
      if (!currentUser) return false;
      return currentUser.uid === ADMIN_UID || currentUser.uid === plant.addedByUid;
    }

    /* ---------- Login / logout ---------- */
    async function login() {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
        return true;
      } catch (err) {
        const keys = {
          "auth/popup-blocked": "popupBlocked",
          "auth/unauthorized-domain": "unauthorizedDomain",
          "auth/operation-not-allowed": "notEnabled"
        };
        const silent = ["auth/popup-closed-by-user", "auth/cancelled-popup-request"];
        if (!silent.includes(err.code)) {
          showToast(keys[err.code] ? t(keys[err.code]) : t("loginFailed", { msg: err.message }), true);
        }
        return false;
      }
    }

    function drawAuthArea() {
      const area = $("authArea");
      if (!auth) { area.innerHTML = ""; return; }
      if (!currentUser) {
        area.innerHTML = `<button id="loginBtn" class="btn ghost">${t("login")}</button>`;
        $("loginBtn").addEventListener("click", login);
        return;
      }
      area.innerHTML = `
        <button id="nickBtn" class="btn ghost" title="${escapeHtml(t("changeNick"))}">
          ${myNickname ? "👤 " + escapeHtml(myNickname) : t("chooseNick")}</button>
        <button id="logoutBtn" class="btn ghost small">${t("logout")}</button>`;
      $("nickBtn").addEventListener("click", openNicknameForm);
      $("logoutBtn").addEventListener("click", () => signOut(auth));
    }

    /* ---------- Unique nicknames ----------
       Two collections in Firestore make nicknames unique:
       - users/{uid}         -> { nickname, nicknameKey }   (my nickname)
       - nicknames/{key}     -> { uid }                     (who owns this nickname)
       A document id can exist only once, so two users can never own the same key.
       The key is the nickname in lowercase, so "Dana" and "dana" count as the same. */

    function nicknameKeyOf(nickname) {
      return nickname.toLowerCase();
    }

    // Letters (any language), numbers, space and _ - . '  (2-30 characters)
    function isValidNickname(nickname) {
      return /^[\p{L}\p{N} _.'-]{2,30}$/u.test(nickname)
        && /[\p{L}\p{N}]/u.test(nickname)   // at least one letter or number
        && !nickname.startsWith("__");      // Firestore reserves ids like __x__
    }

    async function loadMyNickname() {
      myNickname = "";
      myNicknameKey = "";
      try {
        const snap = await getDoc(doc(db, "users", currentUser.uid));
        if (snap.exists()) {
          myNickname = snap.data().nickname || "";
          myNicknameKey = snap.data().nicknameKey || "";
        }
      } catch (err) {
        console.error("Could not load nickname:", err);
      }
    }

    function openNicknameForm() {
      // Suggest the current nickname, or the first name from Google (never the full name)
      $("nickInput").value = myNickname || (currentUser?.displayName || "").split(" ")[0].slice(0, 30);
      $("nickError").textContent = "";
      openModal("nickModal");
      setTimeout(() => $("nickInput").focus(), 50);
    }

    $("nickForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      // Clean up: trim and turn multiple spaces into one
      const nickname = $("nickInput").value.trim().replace(/\s+/g, " ");
      if (!isValidNickname(nickname)) {
        $("nickError").textContent = t("nickInvalid");
        return;
      }
      const key = nicknameKeyOf(nickname);

      $("nickSaveBtn").disabled = true;
      $("nickError").textContent = "";
      try {
        // Friendly check first: is somebody else already using it?
        if (key !== myNicknameKey) {
          const taken = await getDoc(doc(db, "nicknames", key));
          if (taken.exists() && taken.data().uid !== currentUser.uid) {
            $("nickError").textContent = t("nickTaken", { name: nickname });
            return;
          }
        }

        // Save everything together (all or nothing)
        const batch = writeBatch(db);
        if (key !== myNicknameKey) {
          batch.set(doc(db, "nicknames", key), { uid: currentUser.uid });
          if (myNicknameKey) batch.delete(doc(db, "nicknames", myNicknameKey)); // free the old one
        }
        batch.set(doc(db, "users", currentUser.uid), { nickname, nicknameKey: key });
        await batch.commit();

        myNickname = nickname;
        myNicknameKey = key;
        closeModal("nickModal");
        drawAuthArea();
        showToast(t("nickSaved", { name: nickname }));
      } catch (err) {
        console.error(err);
        // If two people pick the same nickname at the same moment, the rules reject the second one
        $("nickError").textContent = err.code === "permission-denied"
          ? t("nickTaken", { name: nickname })
          : t("nickFailed", { msg: err.message });
      } finally {
        $("nickSaveBtn").disabled = false;
      }
    });

    // Runs on page load and every time the user logs in or out
    if (auth) {
      onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        myNickname = "";
        myNicknameKey = "";
        if (user) await loadMyNickname();
        drawAuthArea();
        refreshAllPopups(); // show/hide delete buttons
        if (user && !myNickname) openNicknameForm(); // ask once per login if missing
      });
    }

    /* =====================================================================
       8. PLANTS FROM FIRESTORE (real time) + MARKERS
       ===================================================================== */

    const plants = new Map();   // id -> plant data
    const markers = new Map();  // id -> Leaflet marker
    const markersLayer = L.layerGroup().addTo(map);

    // HTML shown in a marker's popup
    function popupHtml(id, p) {
      const date = p.createdAt && p.createdAt.toDate
        ? p.createdAt.toDate().toLocaleDateString(lang === "en" ? "en-GB" : "he-IL") : "";
      return `
        <h3>${escapeHtml(p.name)}</h3>
        ${p.scientificName ? `<p class="sci">${escapeHtml(p.scientificName)}</p>` : ""}
        ${edibleBadge(findEdible(p.scientificName), true)}
        ${p.ediblePart ? `<p><strong>${t("ediblePartShort")}</strong> ${escapeHtml(p.ediblePart)}</p>` : ""}
        ${p.notes ? `<p><strong>${t("notesShort")}</strong> ${escapeHtml(p.notes)}</p>` : ""}
        <p><small>${escapeHtml(t("addedBy", { name: p.addedByName || t("unknownUser") }))}${date ? " · " + escapeHtml(date) : ""}</small></p>
        <div class="popup-actions">
          <button class="btn small more-info-btn" data-id="${escapeHtml(id)}">${t("moreInfo")}</button>
          ${canDelete(p) ? `<button class="btn small danger delete-btn" data-id="${escapeHtml(id)}">${t("delete")}</button>` : ""}
        </div>`;
    }

    // Rebuild all popups (after login/logout or a language change)
    function refreshAllPopups() {
      markers.forEach((marker, id) => marker.setPopupContent(popupHtml(id, plants.get(id))));
    }

    // Buttons inside popups (the popup HTML is created later, so we listen on document)
    document.addEventListener("click", async (e) => {
      const infoBtn = e.target.closest(".more-info-btn");
      if (infoBtn) {
        const p = plants.get(infoBtn.dataset.id);
        if (p) showPlantInfo({ taxonId: p.taxonId, scientificName: p.scientificName, name: p.name });
        return;
      }

      const deleteBtn = e.target.closest(".delete-btn");
      if (deleteBtn) {
        const p = plants.get(deleteBtn.dataset.id);
        if (!p || !confirm(t("confirmDelete", { name: p.name }))) return;
        try {
          await deleteDoc(doc(db, "plants", deleteBtn.dataset.id));
          showToast(t("deleted"));
        } catch (err) {
          showToast(err.code === "permission-denied"
            ? t("noDeletePerm") : t("deleteFailed", { msg: err.message }), true);
        }
      }
    });

    // Listen to the "plants" collection in real time
    if (db) {
      onSnapshot(
        collection(db, "plants"),
        (snapshot) => {
          snapshot.docChanges().forEach((change) => {
            const id = change.doc.id;
            const p = change.doc.data();

            // Remove old marker (for "modified" and "removed")
            if (markers.has(id)) {
              markersLayer.removeLayer(markers.get(id));
              markers.delete(id);
              plants.delete(id);
            }
            if (change.type === "removed") return;

            // Skip broken documents
            if (typeof p.lat !== "number" || typeof p.lng !== "number") return;

            plants.set(id, p);
            const marker = L.marker([p.lat, p.lng], { icon: plantIcon, title: p.name })
              .bindPopup(popupHtml(id, p));
            markersLayer.addLayer(marker);
            markers.set(id, marker);
          });
          setStatus("totalPlants", { n: plants.size });
          renderPlantList();
        },
        (err) => {
          console.error(err);
          setStatus("loadError", { msg: err.code === "permission-denied" ? t("readDenied") : err.message });
        }
      );
    }

    /* =====================================================================
       9. SIDE PANEL - list of plants visible on the map
       ===================================================================== */

    function renderPlantList() {
      const list = $("plantList");
      const filter = normalize($("listFilter").value);
      const bounds = map.getBounds();

      // Keep plants that are inside the visible map area AND match the filter
      const visible = [...plants.entries()]
        .filter(([, p]) => bounds.contains([p.lat, p.lng]))
        .filter(([, p]) => {
          if (!filter) return true;
          const text = normalize(`${p.name} ${p.scientificName} ${p.ediblePart} ${p.notes} ${p.addedByName}`);
          return text.includes(filter);
        })
        .sort((a, b) => String(a[1].name).localeCompare(String(b[1].name), lang));

      $("visibleCount").textContent = visible.length;

      if (visible.length === 0) {
        list.innerHTML = `<li class="empty">${escapeHtml(t("listEmpty"))}</li>`;
        return;
      }

      list.innerHTML = "";
      visible.forEach(([id, p]) => {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${findEdible(p.scientificName) ? "✅" : "🌿"} ${escapeHtml(p.name)}</strong>
          <small>${escapeHtml(p.ediblePart || p.scientificName || "")}</small>
          ${p.addedByName ? `<small>${escapeHtml(t("addedBy", { name: p.addedByName }))}</small>` : ""}`;
        li.addEventListener("click", () => {
          map.setView([p.lat, p.lng], Math.max(map.getZoom(), 16));
          markers.get(id)?.openPopup();
          if (window.innerWidth <= 700) $("sidePanel").classList.remove("open");
        });
        list.appendChild(li);
      });
    }

    map.on("moveend", renderPlantList);
    $("listFilter").addEventListener("input", renderPlantList);
    $("panelToggle").addEventListener("click", () => $("sidePanel").classList.toggle("open"));

    /* =====================================================================
       10. "ADD PLANT" MODE + FORM
       ===================================================================== */

    let addingMode = false;
    let newPlantLatLng = null;   // where the user clicked
    let tempMarker = null;       // temporary marker while filling the form
    let selected = { sci: "", taxonId: 0 }; // the plant picked from the suggestions

    function setAddingMode(on) {
      addingMode = on;
      $("addBtn").classList.toggle("active", on);
      $("addBtn").textContent = on ? t("cancelAdd") : t("addPlant");
      $("addHint").classList.toggle("show", on);
      $("map").classList.toggle("adding", on);
    }

    // Adding requires login AND a nickname
    $("addBtn").addEventListener("click", async () => {
      if (addingMode) { setAddingMode(false); return; }
      if (!currentUser) {
        showToast(t("needLogin"));
        if (!(await login())) return;
        await loadMyNickname();
      }
      if (!myNickname) {
        showToast(t("needNickname"));
        openNicknameForm();
        return;
      }
      setAddingMode(true);
    });

    // When in adding mode, a click on the map opens the form
    map.on("click", (e) => {
      if (!addingMode) return;
      setAddingMode(false);
      openAddForm(e.latlng);
    });

    function openAddForm(latlng) {
      newPlantLatLng = latlng;
      selected = { sci: "", taxonId: 0 };
      $("addForm").reset();
      $("formError").textContent = "";
      $("pickedInfo").innerHTML = "";
      $("nameSuggestions").innerHTML = "";
      $("locationText").value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;

      if (tempMarker) tempMarker.remove();
      tempMarker = L.marker(latlng, { icon: plantIcon, opacity: 0.6 }).addTo(map);

      openModal("addModal");
      setTimeout(() => $("plantName").focus(), 50);
    }

    // Remove the temporary marker whenever the form closes
    new MutationObserver(() => {
      if (!$("addModal").classList.contains("show") && tempMarker) {
        tempMarker.remove();
        tempMarker = null;
      }
    }).observe($("addModal"), { attributes: true, attributeFilter: ["class"] });

    /* ---------- Autocomplete for the plant name ---------- */
    const nameInput = $("plantName");

    // Typing again means the previous selection is no longer valid
    nameInput.addEventListener("input", () => {
      selected = { sci: "", taxonId: 0 };
      $("scientificName").value = "";
      $("pickedInfo").innerHTML = "";
    });

    createSearch(nameInput, $("nameSuggestions"), (item) => {
      $("nameSuggestions").innerHTML = "";
      nameInput.value = item.title.slice(0, LIMITS.name);
      selected = { sci: item.sci, taxonId: item.taxonId };
      $("scientificName").value = item.sci;
      $("pickedInfo").innerHTML = `<p>${edibleBadge(item.edible, true)}
        ${item.edible?.warning ? `<span class="note">⚠️ ${escapeHtml(tr(item.edible.warning))}</span>` : ""}</p>`;
      if (item.edible && !$("ediblePart").value.trim()) {
        $("ediblePart").value = tr(item.edible.parts).slice(0, LIMITS.ediblePart);
      }
    });

    /* ---------- Validation (same rules as in Firestore) ---------- */
    function validatePlant(data) {
      if (!data.name) return t("nameRequired");
      for (const [field, max] of Object.entries(LIMITS)) {
        if (typeof data[field] !== "string") return t("fieldInvalid", { field });
        if (data[field].length > max) return t("tooLong", { max });
      }
      if (!data.addedByName) return t("needNickname");
      if (!Number.isInteger(data.taxonId) || data.taxonId < 0) return t("badTaxon");
      if (typeof data.lat !== "number" || !isFinite(data.lat) || data.lat < -90 || data.lat > 90) return t("badLat");
      if (typeof data.lng !== "number" || !isFinite(data.lng) || data.lng < -180 || data.lng > 180) return t("badLng");
      return null; // null = everything is OK
    }

    /* ---------- Saving to Firestore ---------- */
    $("addForm").addEventListener("submit", async (e) => {
      e.preventDefault(); // don't reload the page
      if (!db) return;
      if (!currentUser) {
        $("formError").textContent = t("needLogin");
        return;
      }

      const data = {
        name: nameInput.value.trim(),
        scientificName: selected.sci,
        taxonId: selected.taxonId,
        ediblePart: $("ediblePart").value.trim(),
        notes: $("notes").value.trim(),
        lat: Number(newPlantLatLng?.lat),
        lng: Number(newPlantLatLng?.lng),
        addedByUid: currentUser.uid,
        addedByName: myNickname
      };

      const error = validatePlant(data);
      if (error) {
        $("formError").textContent = error;
        return;
      }

      $("saveBtn").disabled = true;
      $("formError").textContent = "";
      try {
        await addDoc(collection(db, "plants"), { ...data, createdAt: serverTimestamp() });
        closeModal("addModal");
        showToast(t("saved"));
      } catch (err) {
        console.error(err);
        $("formError").textContent = err.code === "permission-denied"
          ? t("saveBlocked") : t("saveFailed", { msg: err.message });
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    /* =====================================================================
       11. APPLY THE LANGUAGE to the whole page
       ===================================================================== */
    function applyLanguage() {
      const html = document.documentElement;
      html.lang = lang;
      html.dir = lang === "he" ? "rtl" : "ltr";
      document.title = t("pageTitle");

      // Fixed texts in the HTML
      document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
      document.querySelectorAll("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
      document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));

      // Texts created by JavaScript
      setAddingMode(addingMode);
      drawAuthArea();
      drawLayersControl();
      if (locateBtn) locateBtn.title = t("myLocation");
      setStatus(status.key, status.vars);
      refreshAllPopups();
      renderPlantList();

      // Close things that show old-language content
      searchResults.innerHTML = "";
      closeModal("infoModal");
    }

    $("langBtn").addEventListener("click", () => {
      lang = lang === "he" ? "en" : "he";
      try { localStorage.setItem("lang", lang); } catch {}
      applyLanguage();
    });

    // Start!
    map.addControl(new LocateControl());
    applyLanguage();
  </script>

  <!--
  =====================================================================
  FIRESTORE SECURITY RULES
  Copy everything between the lines into:
  Firebase console -> Firestore Database -> Rules -> Publish
  - plants:    anyone can read; logged-in users with a nickname can create
               (validated, only in their own name); nobody can update;
               delete = the user who added it, or the admin.
  - users:     each user can read/write only their own nickname record.
  - nicknames: public list of taken nicknames; makes every nickname unique.
  =====================================================================

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() {
      return request.auth != null;
    }

    function isAdmin() {
      return signedIn() && request.auth.uid == 'j9uBRpG3HuXV7JZ1rz5yuEem8Xj2';
    }

    // Path helpers
    function userPath(uid) {
      return /databases/$(database)/documents/users/$(uid);
    }
    function nicknamePath(key) {
      return /databases/$(database)/documents/nicknames/$(key);
    }

    // Checks that a new plant document looks exactly like the app sends it
    function isValidPlant(d) {
      let fields = ['name', 'scientificName', 'taxonId', 'ediblePart', 'notes',
                    'lat', 'lng', 'addedByUid', 'addedByName', 'createdAt'];
      return d.keys().hasAll(fields) && d.keys().hasOnly(fields)
        && d.name is string && d.name.trim().size() > 0 && d.name.size() <= 100
        && d.scientificName is string && d.scientificName.size() <= 150
        && d.taxonId is int && d.taxonId >= 0
        && d.ediblePart is string && d.ediblePart.size() <= 200
        && d.notes is string && d.notes.size() <= 500
        && d.lat is number && d.lat >= -90 && d.lat <= 90
        && d.lng is number && d.lng >= -180 && d.lng <= 180
        && d.addedByUid == request.auth.uid
        // the name must be the user's own registered (unique) nickname
        && d.addedByName == get(userPath(request.auth.uid)).data.nickname
        && d.createdAt == request.time;
    }

    match /plants/{plantId} {
      allow read: if true;
      allow create: if signedIn() && isValidPlant(request.resource.data);
      allow update: if false;
      allow delete: if isAdmin()
        || (signedIn() && resource.data.get('addedByUid', '') == request.auth.uid);
    }

    // users/{uid} = { nickname, nicknameKey }
    match /users/{uid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow create, update: if signedIn() && request.auth.uid == uid
        && request.resource.data.keys().hasOnly(['nickname', 'nicknameKey'])
        && request.resource.data.nickname is string
        && request.resource.data.nickname.size() >= 2
        && request.resource.data.nickname.size() <= 30
        && request.resource.data.nicknameKey == request.resource.data.nickname.lower()
        // the nickname must be reserved for this user in the same save
        && getAfter(nicknamePath(request.resource.data.nicknameKey)).data.uid == uid;
      allow delete: if false;
    }

    // nicknames/{key} = { uid }. A document id is unique, so a nickname
    // can be created only if nobody has it (there is no "update" rule).
    match /nicknames/{key} {
      allow read: if true;
      allow create: if signedIn()
        && request.resource.data.keys().hasOnly(['uid'])
        && request.resource.data.uid == request.auth.uid
        && getAfter(userPath(request.auth.uid)).data.nicknameKey == key;
      allow delete: if signedIn()
        && resource.data.uid == request.auth.uid
        && getAfter(userPath(request.auth.uid)).data.nicknameKey != key;
    }

    // Everything else in the database is closed
    match /{document=**} {
      allow read, write: if false;
    }
  }
}
